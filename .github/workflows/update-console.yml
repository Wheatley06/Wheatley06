
name: Update Profile Console

on:
  push:
    branches:
      - main
    paths:
      - "Images/Profile/Profile/profile.png"
      - "profile.config.json"
      - ".github/workflows/update-console.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-console
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout console generator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wildanniam/GitHub-Profile-Console
          ref: main
          path: generator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"

      - name: Install generator dependencies
        working-directory: generator
        run: npm ci

      - name: Generate console SVG assets
        working-directory: generator
        run: |
          npm run generate:hero -- \
            --source "$GITHUB_WORKSPACE/Images/Profile/Profile/profile.png" \
            --config "$GITHUB_WORKSPACE/profile.config.json"

      - name: Prepare stable SVG filenames
        run: |
          mkdir -p assets/profile-console

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const source = 'generator/assets/hero';
          const destination = 'assets/profile-console';

          const manifest = JSON.parse(
            fs.readFileSync(path.join(source, 'manifest.json'), 'utf8')
          );

          const files = {
            desktopDark: 'console-dark.svg',
            desktopLight: 'console-light.svg',
            mobileDark: 'console-mobile-dark.svg',
            mobileLight: 'console-mobile-light.svg'
          };

          for (const [key, filename] of Object.entries(files)) {
            const generated = manifest.assets[key];

            if (!generated) {
              throw new Error(`Missing generated asset: ${key}`);
            }

            fs.copyFileSync(
              path.join(source, generated),
              path.join(destination, filename)
            );
          }

          fs.copyFileSync(
            path.join(source, 'manifest.json'),
            path.join(destination, 'manifest.json')
          );
          NODE

      - name: Commit and publish generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-console/

          if git diff --cached --quiet; then
            echo "No changes in generated SVG files."
            exit 0
          fi

          git commit -m "Update profile console assets"
          git push
