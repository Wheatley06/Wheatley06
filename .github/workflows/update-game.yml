
name: Generate Space Shooter Game

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Space Shooter
        run: python -m pip install gh-space-shooter

      - name: Generate GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter Wheatley06 --output game.gif --strategy random

      - name: Upload GIF for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: space-shooter-preview
          path: game.gif
          if-no-files-found: error
          retention-days: 1
