name: Update Pac-Man banner

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días 06:00 UTC
  workflow_dispatch:          # botón "Run workflow" manual
  push:
    paths:
      - generate.py
      - .github/workflows/pacman.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG
        run: python generate.py pacman-contributions.svg
        env:
          GH_USER: Wheatley06
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update pac-man banner"
            git push
          fi
