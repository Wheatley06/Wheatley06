name: Update profile banners

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días 06:00 UTC
  workflow_dispatch:          # botón "Run workflow" manual
  push:
    paths:
      - generate.py
      - generate_chambers.py
      - .github/workflows/pacman.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Pac-Man banner
        run: |
          mkdir -p assets/pacman
          python generate.py assets/pacman/pacman-contributions.svg
        env:
          GH_USER: Wheatley06
      - name: Generate test chambers
        run: |
          mkdir -p assets/test-chambers
          python generate_chambers.py assets/test-chambers/test-chambers.svg
        env:
          GH_USER: Wheatley06
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman/pacman-contributions.svg assets/test-chambers/test-chambers.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile banners"
            git push
          fi
